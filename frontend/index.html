<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* One canonical host: www (Railway serves it too) redirects to the
         apex before anything loads, so sign-in, cookies and canonical
         URLs only ever see ontariodrivetestmap.fyi. */
      if (location.hostname === "www.ontariodrivetestmap.fyi") {
        location.replace("https://ontariodrivetestmap.fyi" + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OntarioDriveTestMap — Ontario G/G2 road-test routes</title>
    <meta
      name="description"
      content="An independent map of reported Ontario G and G2 road-test routes, built from GPS traces, video-transcribed drives and community reports, with confirmed and inferred sections labelled."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="OntarioDriveTestMap" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OntarioDriveTestMap — Ontario G/G2 road-test routes" />
    <meta
      property="og:description"
      content="An independent map of reported Ontario G and G2 road-test routes, built from GPS traces, video-transcribed drives and community reports, with confirmed and inferred sections labelled."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OntarioDriveTestMap",
        "description": "Crowdsourced Ontario G/G2 DriveTest routes built from real GPS traces, community reports and video-transcribed test drives."
      }
    </script>
    <style>
      /* Pre-mount shell: avoids a blank white flash before the JS bundle
         loads and React replaces this. Kept intentionally tiny/inline
         since App.css hasn't loaded yet at this point. */
      html, body { background: #f6f8f7; margin: 0; }
      #root:empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: "";
        width: 28px; height: 28px;
        border: 2px solid #d5e2df;
        border-top-color: #102a43;
        border-radius: 50%;
        animation: preload-spin 0.7s linear infinite;
      }
      @keyframes preload-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after { animation-duration: 1.4s; }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
